name: 15 Dakikalık GB Fiyat Botu

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Playwright Tarayıcı Altyapısını Kur
        run: npx playwright install chromium --with-deps

      - name: Botu Tetikle Belgeyi Enjekte Et
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scraper.js
